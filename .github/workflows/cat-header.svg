<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1423" />
      <stop offset="50%" stop-color="#3d2b56" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>
    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 42px;
        font-weight: 700;
        fill: #ffffff;
        animation: fadeIn 1.2s ease-in-out;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 18px;
        fill: #e9c46a;
        animation: fadeIn 1.5s ease-in-out;
      }
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .tail-wag {
        transform-origin: 25px 40px;
        animation: wag 3s ease-in-out infinite;
      }
      @keyframes wag {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(15deg); }
      }
      .cat-blink {
        animation: blink 4s infinite;
      }
      @keyframes blink {
        0%, 96%, 98%, 100% { transform: scaleY(1); }
        97%, 99% { transform: scaleY(0.1); }
      }
      .paw-wave {
        transform-origin: 10px 0px;
        animation: wave 2s ease-in-out infinite;
      }
      @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-20deg); }
      }
    </style>
  </defs>

  <!-- Waving Background -->
  <path d="M0,0 L0,150 C 200,240 350,110 550,160 C 680,190 750,140 800,130 L800,0 Z" fill="url(#headerGrad)" />

  <!-- Text -->
  <g text-anchor="middle">
    <text x="400" y="90" class="text-title">Hi, I'm Teej</text>
    <text x="400" y="130" class="text-subtitle">CS Student · Web Developer · Machine Learning</text>
  </g>

  <!-- Cat sitting on the wave on the right -->
  <g transform="translate(680, 115)">
    <!-- tail -->
    <g class="tail-wag">
      <path d="M 25,40 C 45,45 60,20 50,10 C 45,5 40,15 45,25 C 48,35 30,45 25,40" fill="#f4a261" />
    </g>
    <!-- body -->
    <path d="M 10,25 C 25,10 40,25 35,50 L 5,50 C -5,35 0,25 10,25 Z" fill="#f4a261" />
    <!-- head -->
    <circle cx="15" cy="18" r="14" fill="#f4a261" />
    <!-- ears -->
    <polygon points="5,8 8,-6 18,6" fill="#f4a261" />
    <polygon points="15,6 24,-4 26,8" fill="#f4a261" />
    <!-- inner ears -->
    <polygon points="7,6 10,-2 15,6" fill="#e76f51" opacity="0.6"/>
    <polygon points="17,6 22,0 24,6" fill="#e76f51" opacity="0.6"/>
    
    <g class="cat-blink" transform="translate(15, 15)">
      <!-- eyes -->
      <circle cx="-5" cy="0" r="1.8" fill="#1a1423" />
      <circle cx="5" cy="0" r="1.8" fill="#1a1423" />
    </g>
    
    <!-- nose -->
    <polygon points="14,19 16,19 15,21" fill="#e76f51" />
    
    <!-- whiskers -->
    <line x1="8" y1="18" x2="-2" y2="16" stroke="#e9c46a" stroke-width="1.2" />
    <line x1="8" y1="20" x2="-2" y2="20" stroke="#e9c46a" stroke-width="1.2" />
    <line x1="22" y1="18" x2="32" y2="16" stroke="#e9c46a" stroke-width="1.2" />
    <line x1="22" y1="20" x2="32" y2="20" stroke="#e9c46a" stroke-width="1.2" />
  </g>

  <!-- Peeking cat from top left -->
  <g transform="translate(100, 0)">
    <!-- head peeking down -->
    <path d="M-25,0 C-25,30 25,30 25,0 Z" fill="#f4a261" />
    
    <!-- ears -->
    <polygon points="-20,0 -15,-15 -5,0" fill="#f4a261" />
    <polygon points="5,0 15,-15 20,0" fill="#f4a261" />
    
    <!-- eyes -->
    <g class="cat-blink" transform="translate(0, 10)">
      <ellipse cx="-8" cy="0" rx="2" ry="3" fill="#1a1423" />
      <ellipse cx="8" cy="0" rx="2" ry="3" fill="#1a1423" />
      <!-- catchlights -->
      <circle cx="-8.5" cy="-1" r="1" fill="#ffffff" />
      <circle cx="7.5" cy="-1" r="1" fill="#ffffff" />
    </g>
    
    <!-- nose -->
    <polygon points="-2,16 2,16 0,18" fill="#e76f51" />
    
    <!-- paws hanging down -->
    <!-- right paw waves -->
    <g class="paw-wave" transform="translate(15, 0)">
      <rect x="-4" y="0" width="8" height="20" rx="4" fill="#f4a261" />
      <!-- toes -->
      <line x1="-2" y1="16" x2="-2" y2="20" stroke="#e76f51" stroke-width="1" />
      <line x1="2" y1="16" x2="2" y2="20" stroke="#e76f51" stroke-width="1" />
    </g>
    <g transform="translate(-15, 0)">
      <rect x="-4" y="0" width="8" height="15" rx="4" fill="#f4a261" />
      <line x1="-2" y1="11" x2="-2" y2="15" stroke="#e76f51" stroke-width="1" />
      <line x1="2" y1="11" x2="2" y2="15" stroke="#e76f51" stroke-width="1" />
    </g>
  </g>
</svg>
