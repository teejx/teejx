<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1423" />
      <stop offset="50%" stop-color="#3d2b56" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>
    <style>
      .zz {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: bold;
        fill: #e9c46a;
        animation: floatZ 3s infinite linear;
        opacity: 0;
      }
      .z1 { animation-delay: 0s; }
      .z2 { animation-delay: 1s; }
      .z3 { animation-delay: 2s; }
      
      @keyframes floatZ {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 0.8; }
        100% { transform: translate(15px, -30px) scale(1.2); opacity: 0; }
      }
      
      .ear-flick {
        transform-origin: 40px -10px;
        animation: flick 4s infinite;
      }
      @keyframes flick {
        0%, 90%, 100% { transform: rotate(0deg); }
        92% { transform: rotate(10deg); }
        94% { transform: rotate(0deg); }
        96% { transform: rotate(10deg); }
        98% { transform: rotate(0deg); }
      }
    </style>
  </defs>

  <!-- Waving Background (starts from bottom, waves upwards) -->
  <path d="M0,120 L0,50 C 150,10 300,80 500,40 C 650,10 750,60 800,30 L800,120 Z" fill="url(#footerGrad)" />

  <!-- Sleeping cat on the wave -->
  <g transform="translate(480, 40)">
    <!-- tail curled around -->
    <path d="M 0,0 C -20,5 -30,-5 -25,-15 C -20,-25 -5,-25 5,-15" fill="#f4a261" />
    <!-- body -->
    <ellipse cx="20" cy="-5" rx="25" ry="12" fill="#f4a261" />
    <!-- head -->
    <circle cx="45" cy="-5" r="11" fill="#f4a261" />
    <!-- ears with flick -->
    <g class="ear-flick">
      <polygon points="38,-13 42,-23 48,-15" fill="#f4a261" />
      <polygon points="46,-13 52,-21 54,-11" fill="#f4a261" />
    </g>
    <!-- sleeping eyes -->
    <path d="M 40,-3 Q 43,-1 46,-3" stroke="#1a1423" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 50,-3 Q 52,-1 54,-3" stroke="#1a1423" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Zzz -->
    <g transform="translate(50, -25)">
      <text x="0" y="0" font-size="12" class="zz z1">z</text>
      <text x="6" y="-12" font-size="16" class="zz z2">z</text>
      <text x="14" y="-26" font-size="20" class="zz z3">Z</text>
    </g>
  </g>
  
  <!-- paw prints leading along the footer -->
  <g transform="translate(200, 70)">
     <g opacity="0.3" fill="#1a1423">
       <circle cx="0" cy="0" r="2.5"/> <circle cx="4" cy="-5" r="1.5"/> <circle cx="-4" cy="-5" r="1.5"/> <circle cx="0" cy="-7" r="1.5"/>
     </g>
     <g opacity="0.3" fill="#1a1423" transform="translate(25, -15) rotate(15)">
       <circle cx="0" cy="0" r="2.5"/> <circle cx="4" cy="-5" r="1.5"/> <circle cx="-4" cy="-5" r="1.5"/> <circle cx="0" cy="-7" r="1.5"/>
     </g>
     <g opacity="0.3" fill="#1a1423" transform="translate(55, -25) rotate(30)">
       <circle cx="0" cy="0" r="2.5"/> <circle cx="4" cy="-5" r="1.5"/> <circle cx="-4" cy="-5" r="1.5"/> <circle cx="0" cy="-7" r="1.5"/>
     </g>
  </g>

</svg>
